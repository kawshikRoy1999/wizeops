name: wizeops
description: Streamlined operational checklist management for Wize Restaurant staff.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.3+1

  # Dependency Injection
  get_it: ^7.7.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Local Storage (Offline)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Fonts & Icons
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0

  # Utilities
  dartz: ^0.10.1

  # File & Image Picking
  image_picker: ^1.1.2
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
